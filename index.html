<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta name="description" content="FV Casa - monitoraggio impianto fotovoltaico">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FV Casa">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>FV Casa</title>
</head>
<body>

<main class="app">

<header class="page-header">
  <h1>🏠 Oggi</h1>
  <div id="todayDate" class="today-date">—</div>
</header>

<section class="home-card production-card">
  <div class="home-card-title">☀️ Produzione</div>
  <div class="production-value">
    <span id="produzioneKwh">—</span>
    <small>kWh</small>
  </div>
</section>

<section class="home-card energy-card">
  <div class="home-card-title">⚡ Energia</div>

  <div class="energy-row">
    <span>Consumo</span>
    <strong id="consumoKwh">—</strong>
  </div>

  <div class="energy-row">
    <span>Immissione</span>
    <strong id="immessoKwh">—</strong>
  </div>

  <div class="energy-row">
    <span>Prelievo</span>
    <strong id="prelevatoKwh">—</strong>
  </div>
</section>

<section class="home-card savings-card">
  <div class="home-card-title">💰 Risparmio</div>

  <div class="savings-grid">
    <div class="saving-item">
      <div class="saving-name">Oggi</div>
      <strong id="risparmioOggi">—</strong>
    </div>

    <div class="saving-item">
      <div class="saving-name">Questo mese</div>
      <strong id="risparmioMese">—</strong>
    </div>

    <div class="saving-item">
      <div class="saving-name">Cumulato</div>
      <strong id="risparmioCumulato">—</strong>
    </div>
  </div>
</section>

<div id="status" class="status">Connessione in corso…</div>

<nav class="bottom-nav" aria-label="Navigazione principale">
  <button class="nav-item active" type="button" aria-label="Oggi">
    <span>🏠</span>
    <small>Oggi</small>
  </button>
  <button class="nav-item" type="button" aria-label="Storico">
    <span>📊</span>
    <small>Storico</small>
  </button>
  <button class="nav-item" type="button" aria-label="Risparmio">
    <span>💰</span>
    <small>Risparmio</small>
  </button>
  <button class="nav-item" type="button" aria-label="Impostazioni">
    <span>⚙️</span>
    <small>Impostazioni</small>
  </button>
</nav>

<footer>
  <span>Ultimo aggiornamento</span>
  <strong id="lastUpdate">—</strong>
</footer>

</main>

<script src="app.js"></script>
</body>
</html>
